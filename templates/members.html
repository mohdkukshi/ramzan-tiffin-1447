{% extends "layout.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center">
    <h3>Members Management</h3>
    <a href="/export_members" class="btn btn-success">Export CSV</a>
</div>

<div class="card p-4 mt-3 shadow">
    <form method="POST" class="row g-3">
        <div class="col-md-4">
            <input type="text" name="sabil" placeholder="Sabil Number" class="form-control" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="name" placeholder="Member Name" class="form-control" required>
        </div>
        <div class="col-md-4">
            <button class="btn btn-dark w-100">Add Member</button>
        </div>
    </form>
</div>

<div class="card mt-4 shadow">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Sabil Number</th>
                    <th>Name</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for m in members %}
                <tr>
                    <td>{{ m[0] }}</td>
                    <td>{{ m[1] }}</td>
                    <td>{{ m[2] }}</td>
                    <td>{{ m[3] }}</td>
                    <td>
                        <a href="/delete_member/{{ m[0] }}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
