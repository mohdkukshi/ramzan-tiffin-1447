{% extends "base.html" %}
{% block content %}

<h2>Members</h2>

<div class="card">

    <form method="POST" style="display:flex; gap:15px; margin-bottom:20px;">
        <input type="text" name="sabil" placeholder="Sabil Number" required>
        <input type="text" name="name" placeholder="Member Name" required>
        <button class="btn-grey">Add</button>
    </form>

    <table width="100%" cellpadding="10" style="border-collapse:collapse;">
        <tr style="background:#ecf0f1;">
            <th>ID</th>
            <th>Sabil</th>
            <th>Name</th>
            <th>Action</th>
        </tr>

        {% for m in members %}
        <tr style="border-top:1px solid #ddd;">
            <td>{{ m[0] }}</td>
            <td>{{ m[1] }}</td>
            <td>{{ m[2] }}</td>
            <td>
                <a href="{{ url_for('edit_member', member_id=m[0]) }}" class="btn-yellow">Edit</a>
                <a href="{{ url_for('delete_member', member_id=m[0]) }}" class="btn-red">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

{% endblock %}
