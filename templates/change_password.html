{% extends "layout.html" %}
{% block content %}

<h3>Change Password</h3>

<div class="card p-4 shadow">
    <form method="POST">
        <input type="password" name="current" placeholder="Current Password" class="form-control mb-3" required>
        <input type="password" name="new" placeholder="New Password" class="form-control mb-3" required>
        <button class="btn btn-dark">Update Password</button>
    </form>
</div>

{% endblock %}
