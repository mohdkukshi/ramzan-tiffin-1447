{% extends "base.html" %}

{% block content %}

<h2>Ramzan Tiffin Pirsa {{ year }}</h2>

<form method="GET" style="margin-bottom:20px;">
    <select name="member" onchange="this.form.submit()" style="padding:8px; width:300px;">
        <option value="">Select Member</option>
        {% for m in members %}
            <option value="{{ m[0] }}"
                {% if selected_member and selected_member|int == m[0] %}
                    selected
                {% endif %}
            >
                {{ m[1] }}
            </option>
        {% endfor %}
    </select>
</form>

{% if selected_member %}

<div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:15px; max-width:900px;">

    {% for day in range(1,31) %}
        {% if day in attendance_days %}
            <button style="background:#95a5a6; color:white; padding:10px; border:none; border-radius:5px;" disabled>
                Day {{ day }} ✓
            </button>
        {% else %}
            <form method="POST">
                <input type="hidden" name="member_id" value="{{ selected_member }}">
                <input type="hidden" name="day" value="{{ day }}">
                <button type="submit"
                        style="background:#27ae60; color:white; padding:10px; border:none; border-radius:5px; width:100%;">
                    Day {{ day }}
                </button>
            </form>
        {% endif %}
    {% endfor %}

</div>

<br><br>

<a href="{{ url_for('dashboard') }}">
    <button type="button">Back to Dashboard</button>
</a>

<a href="{{ url_for('members') }}">
    <button type="button" style="margin-left:10px;">Back to Members</button>
</a>

{% endif %}

{% endblock %}
