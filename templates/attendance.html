{% extends "layout.html" %}
{% block content %}

<h3>Ramzan Tiffin Pirsa {{ year }}</h3>

<form method="GET">
    <select name="member" class="form-control mb-3" onchange="this.form.submit()">
        <option value="">Select Member</option>
        {% for m in members %}
            <option value="{{ m[0] }}"
                {% if selected_member == m[0]|string %}selected{% endif %}>
                {{ m[1] }}
            </option>
        {% endfor %}
    </select>
</form>

{% if selected_member %}
<div class="row">
    {% for day in range(1,31) %}
    <div class="col-md-2 mb-2">
        {% if day in attendance_days %}
            <button class="btn btn-secondary w-100" disabled>
                Day {{ day }} ✓
            </button>
        {% else %}
            <form method="POST">
                <input type="hidden" name="member_id" value="{{ selected_member }}">
                <input type="hidden" name="day" value="{{ day }}">
                <button class="btn btn-success w-100">
                    Day {{ day }}
                </button>
            </form>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}

{% endblock %}
