<!DOCTYPE html>
<html>
<head>
    <title>Ramzan Tiffin Pirsa {{ year }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: #2c3e50;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            font-weight: bold;
        }

        .nav-right a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .nav-right a:hover {
            background: rgba(255,255,255,0.15);
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            max-width: 100%;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }

        .flash {
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        Ramzan Tiffin Pirsa {{ year }}
    </div>

    <div class="nav-right">

        {% if request.endpoint == "dashboard" %}

            <a href="{{ url_for('members') }}">Members</a>
            <a href="{{ url_for('users') }}">Users</a>
            <a href="{{ url_for('settings') }}">Settings</a>
            <a href="{{ url_for('change_password') }}">Change Password</a>
            <a href="{{ url_for('logout') }}">Logout</a>

        {% else %}

            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>

        {% endif %}

    </div>
</div>

<div class="container">

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
