<!DOCTYPE html>
<html>
<head>
    <title>Ramzan Tiffin Pirsa {{ year }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: #2c3e50;
            padding: 15px;
            color: white;
        }

        .navbar a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            max-width: 600px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }

        .flash {
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <strong>Ramzan Tiffin Pirsa {{ year }}</strong>
    |
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('members') }}">Members</a>
    <a href="{{ url_for('attendance') }}">Attendance</a>
    <a href="{{ url_for('users') }}">Users</a>
    <a href="{{ url_for('settings') }}">Settings</a>
    <a href="{{ url_for('change_password') }}">Change Password</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
