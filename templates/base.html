<!DOCTYPE html>
<html>
<head>
    <title>Ramzan Tiffin Pirsa {{ year }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: #1f2a36;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links a {
            text-decoration: none;
            padding: 8px 14px;
            margin-left: 8px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-dark { background:#34495e; color:white; }
        .btn-yellow { background:#f39c12; color:black; }
        .btn-blue { background:#3498db; color:white; }
        .btn-red { background:#e74c3c; color:white; }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input, select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="navbar-title">
        Ramzan Tiffin Pirsa {{ year }}
    </div>

    <div class="nav-links">

        {% if request.endpoint == "dashboard" %}
            <a href="{{ url_for('members') }}" class="btn-dark">Members</a>
            <a href="{{ url_for('users') }}" class="btn-yellow">Users</a>
            <a href="{{ url_for('settings') }}" class="btn-blue">Settings</a>
            <a href="{{ url_for('change_password') }}" class="btn-dark">Change Password</a>
            <a href="{{ url_for('logout') }}" class="btn-red">Logout</a>

        {% else %}
            <a href="{{ url_for('dashboard') }}" class="btn-dark">Dashboard</a>
            <a href="{{ url_for('logout') }}" class="btn-red">Logout</a>
        {% endif %}

    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
