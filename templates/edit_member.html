{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Edit Member</h2>

    <form method="POST">
        <label>Sabil Number</label>
        <input type="text" name="sabil" value="{{ member[1] }}" required>

        <label>Name</label>
        <input type="text" name="name" value="{{ member[2] }}" required>

        <button type="submit">Update Member</button>
    </form>
</div>

{% endblock %}
