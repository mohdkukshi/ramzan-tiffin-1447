<!DOCTYPE html>
<html>
<head>
    <title>Edit Member - {{ year }}</title>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }
        input {
            padding: 8px;
            width: 300px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
        }
    </style>
</head>
<body>

<h2>Edit Member</h2>

<form method="POST">
    <input type="text" name="sabil" value="{{ member[1] }}" required><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="{{ url_for('members') }}">Back to Members</a>

</body>
</html>
